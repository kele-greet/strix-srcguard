[project]
name = "srcguard"
version = "0.1.0"
description = "External SRC guardrails for Strix (spike stage)"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.scripts]
srcguard = "srcguard.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.16"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
